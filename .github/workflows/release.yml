# Runs on version tags (vX.Y.Z) pushed to main. Verifies the tag matches package.json,
# bounded ancestry guard (tagged commit must be ancestor of origin/main), re-runs checks
# and publishes a GitHub Release with the CHANGELOG section.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release ref is reachable from origin/main (ancestry guard)
        run: bash .github/workflows/verify-release-ref.sh
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          v=$(bun -e 'console.log(require("./package.json").version)')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: bun run typecheck && bun run lint && bun test
      - name: Extract changelog section
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
      - name: Publish release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
